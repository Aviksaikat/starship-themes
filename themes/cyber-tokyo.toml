"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 20

format = """
$directory\
$git_branch\
$git_status\
$c$rust$golang$nodejs$python\
$cmd_duration\
$line_break\
$character"""

palette = "cyber-tokyo"

# --- path -------------------------------------------------------------------
[directory]
format = "[](fg:color_path)[$path](fg:base bg:color_path)[](fg:color_path)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

# --- git --------------------------------------------------------------------
[git_branch]
format = " [](fg:color_git)[$symbol$branch](fg:base bg:color_git)[](fg:color_git)"

# Renders only when the working tree is dirty; nothing at all when clean.
[git_status]
format = "([ $all_status$ahead_behind](fg:color_git))"

# --- languages (each renders only when detected) ----------------------------
[c]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[rust]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[golang]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[nodejs]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[python]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

# --- command duration -------------------------------------------------------
[cmd_duration]
show_milliseconds = false
format = " [$duration](fg:color_time)"
min_time = 1000

# --- character --------------------------------------------------------------
[character]
success_symbol = "[❯](bold fg:color_path)"
error_symbol = "[❯](bold red)"

[palettes.cyber-tokyo]
color_path = "#bb9af7"
color_git = "#ff2a6d"
color_lang = "#7dcfff"
color_time = "#565f89"
base = "#1a1b26"
