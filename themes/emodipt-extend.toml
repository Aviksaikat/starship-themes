"$schema" = 'https://starship.rs/config-schema.json'

# Port of OMP emodipt-extend — minimal plain-text two-line layout.
# Line 1: time · shell · git (branch + status + metrics)
# Line 2: path
# Line 3: prompt character
add_newline = false
command_timeout = 200
palette = 'emodipt'

format = """
$time\
$shell\
$git_branch\
$git_status\
$git_metrics\
 \
$fill\
$status\
$cmd_duration\
$line_break\
$directory\
$line_break\
$character"""

right_format = ''

[palettes.emodipt]
yellow = '#E5C07B'
red    = '#E06C75'
gold   = '#F3C267'
green  = '#b8ff75'
blue   = '#61AFEF'
white  = '#ffffff'

[time]
disabled    = false
time_format = '%H:%M:%S'
format      = '[\[$time\]](fg:yellow) '

[shell]
disabled         = false
zsh_indicator    = 'zsh'
fish_indicator   = 'fish'
bash_indicator   = 'bash'
style            = 'fg:red'
format           = '[$indicator ]($style)'

[git_branch]
symbol = ''
style  = 'fg:gold'
format = '[$symbol $branch]($style)'

[git_status]
style    = 'fg:gold'
format   = '[$all_status$ahead_behind]($style)'

[git_metrics]
disabled            = false
added_style         = 'fg:green'
deleted_style       = 'fg:red'
format              = '( [+$added]($added_style)[-$deleted]($deleted_style))'

[directory]
style  = 'bold fg:blue'
format = '[ $path ]($style)'
truncation_length = 4
truncation_symbol = '…/'

[fill]
symbol = ' '

[status]
disabled = false
format   = '[$symbol$status]($style) '
style    = 'fg:green'
symbol   = 'x'

[cmd_duration]
min_time = 1
format   = '[ ⏱$duration](fg:green)'

[character]
success_symbol = '[❯](bold fg:red)'
error_symbol   = '[❯](bold fg:red)'
