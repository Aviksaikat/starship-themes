"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 20

format = "$directory$git_branch$git_status$c$rust$golang$nodejs$python$cmd_duration$line_break$character"

palette = "circuit-glacier"

[directory]
format = "[](fg:color_path)[󰀵 $path](fg:base bg:color_path)[](fg:color_path)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
format = " [](fg:color_git)[$symbol$branch](fg:base bg:color_git)[](fg:color_git)"

[git_status]
format = "([ $all_status$ahead_behind](fg:color_git))"

[c]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[rust]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[golang]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[nodejs]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[python]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[cmd_duration]
show_milliseconds = false
format = " [$duration](fg:color_time)"
min_time = 1000

[character]
success_symbol = "[❯](bold fg:color_path)"
error_symbol = "[❯](bold red)"

[palettes.circuit-glacier]
color_path = "#00cf9a"
color_git  = "#0097c6"
color_lang = "#00a87e"
color_time = "#007a60"
base       = "#050d12"
