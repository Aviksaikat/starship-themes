"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#45475A)\
$os\
$username\
[](bg:#CBA6F7 fg:#45475A)\
$directory\
[](fg:#CBA6F7 bg:#F38BA8)\
$git_branch\
$git_status\
[](fg:#F38BA8 bg:#89B4FA)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#89B4FA bg:#94E2D5)\
$docker_context\
[](fg:#94E2D5 bg:#313244)\
$time\
[ ](fg:#313244)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#45475A"
style_root = "bg:#45475A"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#45475A"
disabled = true # Disabled by default

[directory]
style = "bg:#CBA6F7"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#94E2D5"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#F38BA8"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#F38BA8"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#89B4FA"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#313244"
format = '[ ♥ $time ]($style)'
