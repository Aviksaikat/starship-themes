"$schema" = 'https://starship.rs/config-schema.json'

# Port of the OMP cobalt2 theme.
# Left: path (blue pill) → git branch+status (green pill) → character.
add_newline = false
command_timeout = 200
palette = 'cobalt2'

format = """
[](fg:blue)\
$directory\
[](fg:blue bg:green)\
$git_branch\
$git_status\
[](fg:green)\
$cmd_duration\
$line_break\
$character"""

[palettes.cobalt2]
blue  = '#1478DB'
green = '#3AD900'
black = '#000000'

[directory]
style             = 'bold fg:black bg:blue'
format            = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'

[git_branch]
symbol = ''
style  = 'fg:black bg:green'
format = '[ $symbol $branch ]($style)'

[git_status]
style           = 'fg:black bg:green'
format          = '[$all_status$ahead_behind ]($style)'
conflicted      = '='
ahead           = '⇡${count}'
behind          = '⇣${count}'
diverged        = '⇕⇡${ahead_count}⇣${behind_count}'
untracked       = '?'
stashed         = '$'
modified        = '!'
staged          = '+'
renamed         = '»'
deleted         = '✘'

[cmd_duration]
min_time = 500
format   = '[ ⏱ $duration](bold fg:green)'

[character]
success_symbol = '[>](bold fg:green)'
error_symbol   = '[>](bold fg:red)'
