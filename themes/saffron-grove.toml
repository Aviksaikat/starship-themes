"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 20

format = "$directory$git_branch$git_status$c$rust$golang$nodejs$python$cmd_duration$line_break$character"
palette = "saffron-grove"

[directory]
format = "[󰀵 $path](fg:base bg:color_path)[](fg:color_path)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[git_branch]
format = " [](fg:color_git)[$symbol$branch](fg:base bg:color_git)[](fg:color_git)"

[git_status]
format = "([ $all_status$ahead_behind](fg:color_git))"

[c]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"
[rust]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"
[golang]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"
[nodejs]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"
[python]
format = " [](fg:color_lang)[$symbol$version](fg:base bg:color_lang)[](fg:color_lang)"

[cmd_duration]
show_milliseconds = false
format = " [$duration](fg:color_time)"
min_time = 1000

[character]
success_symbol = "[](bold fg:color_path)"
error_symbol = "[](bold red)"

[palettes.saffron-grove]
color_path = "#c8973a"
color_git  = "#b55840"
color_lang = "#7ea85f"
color_time = "#8c6020"
base       = "#1e1610"
