"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#1A1B26)\
$os\
$username\
[](bg:#7AA2F7 fg:#1A1B26)\
$directory\
[](fg:#7AA2F7 bg:#F7768E)\
$git_branch\
$git_status\
[](fg:#F7768E bg:#BB9AF7)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#BB9AF7 bg:#7DCFFF)\
$docker_context\
[](fg:#7DCFFF bg:#16161E)\
$time\
[ ](fg:#16161E)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#1A1B26"
style_root = "bg:#1A1B26"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#1A1B26"
disabled = true # Disabled by default

[directory]
style = "bg:#7AA2F7"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#7DCFFF"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#F7768E"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#F7768E"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#BB9AF7"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#16161E"
format = '[ ♥ $time ]($style)'
